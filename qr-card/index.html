<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>码上成图</title>
<style>
:root{--ink:#171713;--muted:#706d64;--cream:#f1eee6;--lime:#d9ff43;--line:#d8d4ca}*{box-sizing:border-box}body{margin:0;background:#fbfaf7;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:800}.brand i{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--lime);border-radius:10px;font:italic 20px Georgia}.top small{color:var(--muted);letter-spacing:.1em}.hero,.studio,.history{max-width:1120px;margin:auto}.hero{padding:58px 0 42px;display:flex;justify-content:space-between;align-items:end}.hero b,.history b{font-size:10px;letter-spacing:.22em;color:#777267}.hero h1{font:500 clamp(46px,6vw,78px)/.95 Georgia,serif;letter-spacing:-.05em;margin:14px 0 0}.hero h1 em{font-style:normal;color:#6e6a62}.hero p{color:var(--muted);line-height:1.8}.studio{display:grid;grid-template-columns:.82fr 1.18fr;gap:18px;padding-bottom:70px}.panel{border:1px solid var(--line);border-radius:22px;background:white}.controls{padding:29px}.step{display:flex;gap:13px;margin-bottom:17px}.step>i,.preview-head i{width:29px;height:29px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font:800 10px Arial;font-style:normal;flex:none}.step h2,.preview-head h2{margin:0 0 4px;font-size:19px}.step p{margin:0;color:var(--muted);font-size:12px}.drop{height:150px;border:1.5px dashed #aaa398;border-radius:15px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.drop:hover,.drop.drag{border-color:var(--ink);background:#e9e5dc}.drop span{font-size:24px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}.drop strong{max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.drop small{color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:27px 0}label{display:block;position:relative;font-size:12px;font-weight:700;margin:16px 0;color:#555148}input{display:block;width:100%;height:48px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:0 50px 0 14px;outline:none}input:focus{border-color:var(--ink);box-shadow:0 0 0 3px #d9ff4366}label i{position:absolute;right:13px;bottom:16px;font:normal 10px Arial;color:#999}.tip{font-size:11px;line-height:1.6;color:var(--muted);background:var(--cream);padding:11px 13px;border-radius:9px}.preview{padding:24px;background:#eeece5}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.preview-head div{display:flex;align-items:center;gap:10px}.preview-head b{font-size:10px;color:var(--muted)}.canvas-wrap{padding:24px;background:#fff;border-radius:15px;box-shadow:0 8px 30px #19181412}canvas{display:block;width:100%;aspect-ratio:1}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}.actions button{height:52px;border:1px solid var(--ink);border-radius:11px;background:white;font-weight:800}.actions .primary{background:var(--ink);color:#fff}.status{height:20px;text-align:center;font-size:11px;color:var(--muted);padding-top:7px}.history{border-top:1px solid var(--line);padding:55px 0 70px}.history-head{display:flex;justify-content:space-between;align-items:end}.history h2{font:500 42px Georgia,serif;margin:9px 0 0}.history-head p{font-size:13px;color:var(--muted)}.empty{height:200px;border:1px dashed #aaa398;border-radius:18px;margin-top:28px;background:var(--cream);display:flex;flex-direction:column;justify-content:center;align-items:center}.empty h3{margin:5px}.empty p{font-size:13px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.card img{width:100%;aspect-ratio:1;object-fit:cover}.card div{padding:15px}.card h3{margin:0 0 5px}.card p,.card time{display:block;margin:0 0 7px;color:var(--muted);font-size:12px}.card button{border:0;background:none;padding:0;text-decoration:underline;font-size:12px;font-weight:800}.foot{border-top:1px solid var(--line);padding:23px 5vw;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}@media(max-width:800px){.top{padding:0 18px}.top small{display:none}.hero{padding:40px 18px;display:block}.hero p{margin-top:22px}.studio{grid-template-columns:1fr;padding:0 18px 55px}.history{margin:0 18px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.hero h1{font-size:45px}.controls{padding:21px}.preview{padding:15px}.canvas-wrap{padding:12px}.actions{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.history-head{display:block}}
</style></head><body>
<header class="top"><div class="brand"><i>Q</i>码上成图</div><small>二维码活动图制作工具</small><button id="reset">新建一张</button></header>
<section class="hero"><div><b>QR CARD STUDIO</b><h1>一张二维码，<br><em>一眼看懂活动。</em></h1></div><p>无需登录，上传、编辑、保存、下载。<br>所有内容仅保存在当前浏览器。</p></section>
<section class="studio"><div class="controls panel"><div class="step"><i>01</i><div><h2>上传二维码</h2><p>支持 PNG、JPG、WebP</p></div></div><div class="drop" id="drop"><input id="file" type="file" accept="image/*" hidden><span>↑</span><strong id="filename">点击或拖入二维码</strong><small>建议使用清晰的正方形图片</small></div><hr><div class="step"><i>02</i><div><h2>编辑中央文字</h2><p>输入后右侧实时预览</p></div></div><label>活动标题<input id="title" maxlength="16" value="1020博览会"><i id="tc">7/16</i></label><label>补充说明（选填）<input id="subtitle" maxlength="18" value="官方POP群"><i id="sc">6/18</i></label><p class="tip">中央标签会遮挡二维码的一部分，请保存后实际扫码确认。</p></div>
<div class="preview panel"><div class="preview-head"><div><i>03</i><h2>预览与导出</h2></div><b>1080 × 1080 px</b></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div><div class="actions"><button id="save">保存到本机记录</button><button class="primary" id="download">下载高清图片 ↓</button></div><div class="status" id="status"></div></div></section>
<section class="history"><div class="history-head"><div><b>SAVED WORK</b><h2>本机活动记录</h2></div><p>记录仅保存在当前浏览器中</p></div><div id="records"></div></section>
<footer class="foot"><strong>码上成图</strong><span>数据不上传 · 隐私更安心</span></footer>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');let source='';const key='qr-card-studio-offline-records-v1';
function draw(){canvas.width=canvas.height=1080;ctx.fillStyle='#fff';ctx.fillRect(0,0,1080,1080);const finish=()=>{const has=$('#subtitle').value.trim().length>0,size=248;ctx.fillStyle='#080808';ctx.beginPath();ctx.roundRect((1080-size)/2,(1080-size)/2,size,size,34);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';const t=$('#title').value.trim()||'活动标题';let fs=t.length>10?25:t.length>7?28:32;ctx.font=`700 ${fs}px Arial`;ctx.fillText(t,540,has?511:540,208);if(has){const s=$('#subtitle').value.trim();ctx.font=`600 ${s.length>12?19:22}px Arial`;ctx.fillText(s,540,572,208)}};if(source){const im=new Image();im.onload=()=>{const s=Math.min(940/im.width,940/im.height);ctx.drawImage(im,(1080-im.width*s)/2,(1080-im.height*s)/2,im.width*s,im.height*s);finish()};im.src=source}else{ctx.fillStyle='#f0ede5';ctx.fillRect(70,70,940,940);ctx.fillStyle='#aaa49a';ctx.font='600 34px Arial';ctx.textAlign='center';ctx.fillText('上传二维码后在这里预览',540,530);finish()}}
function useFile(f){if(!f)return;if(!f.type.startsWith('image/'))return msg('请选择图片文件');const r=new FileReader;r.onload=()=>{source=r.result;$('#filename').textContent=f.name;msg('');draw()};r.readAsDataURL(f)}
function msg(t){$('#status').textContent=t}function getRecords(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function setRecords(v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch{return false}}
function render(){const a=getRecords(),el=$('#records');if(!a.length){el.innerHTML='<div class="empty"><h3>还没有保存记录</h3><p>完成第一张活动二维码后，点击“保存到本机记录”</p></div>';return}el.innerHTML='<div class="grid">'+a.map((v,i)=>`<article class="card"><img src="${v.image}" alt="${v.title}二维码"><div><h3>${esc(v.title)}</h3><p>${esc(v.subtitle||'无补充说明')}</p><time>${new Date(v.time).toLocaleString('zh-CN')}</time><button onclick="downloadRecord(${i})">下载图片 ↓</button></div></article>`).join('')+'</div>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.downloadRecord=i=>{const v=getRecords()[i],a=document.createElement('a');a.href=v.image;a.download=`${v.title||'活动'}-二维码.png`;a.click()};
$('#drop').onclick=()=>$('#file').click();$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('drag')};$('#drop').ondragleave=()=>$('#drop').classList.remove('drag');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('drag');useFile(e.dataTransfer.files[0])};$('#file').onchange=e=>useFile(e.target.files[0]);
for(const id of ['title','subtitle'])$('#'+id).oninput=()=>{$('#tc').textContent=$('#title').value.length+'/16';$('#sc').textContent=$('#subtitle').value.length+'/18';draw()};
$('#download').onclick=()=>{if(!source)return msg('请先上传一张二维码');const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=($('#title').value.trim()||'活动')+'-二维码.png';a.click();msg('图片已下载')};
$('#save').onclick=()=>{if(!source)return msg('请先上传一张二维码');const a=getRecords();a.unshift({title:$('#title').value.trim()||'未命名活动',subtitle:$('#subtitle').value.trim(),time:new Date().toISOString(),image:canvas.toDataURL('image/jpeg',.86)});if(a.length>8)a.length=8;if(setRecords(a)){render();msg('已保存到当前浏览器')}else msg('浏览器存储空间不足，请先下载图片')};
$('#reset').onclick=()=>{source='';$('#file').value='';$('#filename').textContent='点击或拖入二维码';$('#title').value='1020博览会';$('#subtitle').value='官方POP群';$('#tc').textContent='7/16';$('#sc').textContent='6/18';msg('');draw()};draw();render();
</script></body></html>
